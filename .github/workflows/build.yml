name: build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    env:
      TEMP: ${{ github.workspace }}\target\tmp
      TMP: ${{ github.workspace }}\target\tmp
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Prepare temporary directory
        shell: pwsh
        run: New-Item -ItemType Directory -Path $env:TEMP -Force | Out-Null
      - name: Build production bridge
        shell: cmd
        run: plugins\zzz\bridge\build.cmd --production
      - uses: actions/upload-artifact@v4
        with:
          name: pudding-zzz-win-x64
          path: target/bridge/
          if-no-files-found: error
